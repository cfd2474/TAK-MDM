worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # APK and XAPK uploads (Chunk 4) are large; the default 1m would reject them.
    client_max_body_size 512m;

    upstream takmdm_api {
        server api:8000;
    }

    # ---------------------------------------------------------------------- #
    # Plaintext, and ONLY the provisioning APK.
    #
    # Android's setup wizard downloads the agent before the device has any
    # identity, using the system trust store — which will never contain a
    # self-signed development CA. An https:// download location therefore fails
    # verification and provisioning dies before the agent is ever installed. The
    # CA we ship in the provisioning extras cannot help: it is read by the agent,
    # which does not exist yet.
    #
    # Serving this one file over HTTP is the supported answer, not a shortcut.
    # PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM exists precisely so the
    # transport does not need to be trusted: Android verifies the downloaded APK
    # against that hash and refuses anything else. A substituted binary is
    # rejected by the device.
    #
    # Everything else on this port is denied. The agent's own traffic, which
    # carries real credentials, stays on 8443 under mTLS.
    # ---------------------------------------------------------------------- #
    server {
        listen 8080;
        # Also on 80, because the download happens on whatever network the device
        # happens to be on during setup — guest Wi-Fi, a hotspot, a hotel — and
        # outbound 8080 is exactly the sort of port such networks block. Port 80 is
        # the one that survives. Nothing else is served here, so widening the
        # listener widens no surface: everything but the APK still 403s.
        listen 80;
        server_name _;

        location = /api/v1/provisioning/agent.apk {
            proxy_pass       http://takmdm_api;
            proxy_set_header Host $host;
        }

        # ACME HTTP-01, for the Let's Encrypt certificate on mdm.tak-solutions.com
        # (W100). Let's Encrypt validates over plain HTTP on port 80 and follows
        # no redirect to TLS, so this must be served here, in the clear.
        #
        # ⚠️ This widens the http surface by exactly one directory of static
        # files that certbot writes and deletes. Nothing is proxied to the app,
        # so the "everything but the APK 403s" rule above still holds for every
        # path that matters.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            return 403 '{"detail":"only the provisioning APK is served over http"}';
            default_type application/json;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /pki/server.crt;
        ssl_certificate_key /pki/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Client certificates are verified against the device CA. "optional" rather
        # than "on" because enrollment is the chicken-and-egg case: a device has no
        # certificate yet when it calls /api/v1/enroll. Per-location rules below
        # tighten that back up.
        ssl_client_certificate /pki/ca.crt;
        ssl_verify_client      optional;
        ssl_verify_depth       1;

        # ------------------------------------------------------------------ #
        # THE SECURITY-CRITICAL PART
        #
        # $client_cert is empty unless nginx itself verified the certificate
        # against the device CA. proxy_set_header then *always* writes the header,
        # which both forwards a genuine certificate and overwrites any value a
        # client tried to supply. An empty value makes nginx omit the header.
        #
        # Without this overwrite, anyone could paste a copied (but unheld)
        # certificate into X-SSL-Client-Cert and authenticate as that device — the
        # TLS handshake is the only thing proving possession of the private key.
        # ------------------------------------------------------------------ #
        set $client_cert "";
        if ($ssl_client_verify = SUCCESS) {
            set $client_cert $ssl_client_escaped_cert;
        }

        # ------------------------------------------------------------------ #
        # This port is device-facing and reachable from the network. Only the
        # endpoints a device genuinely needs are exposed.
        #
        # The admin console and the whole write API live at "/" on the same
        # application, so proxying "/" here would publish an unauthenticated
        # console to the LAN. Default deny; the locations below opt back in.
        # ------------------------------------------------------------------ #
        location / {
            return 403 '{"detail":"not exposed on the device port"}';
            default_type application/json;
        }

        # Enrollment: no client certificate yet, the token is the credential.
        location = /api/v1/enroll {
            proxy_pass         http://takmdm_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-SSL-Client-Cert $client_cert;
        }

        # The provisioning bypass PIN check (W117). No client certificate: the
        # device is still in its setup wizard and has no identity yet, exactly
        # like /api/v1/enroll above — and like it, the enrollment token in the
        # body is the credential. Exact match, so it opts in this one path and
        # not the rest of /api/v1/provisioning/.
        location = /api/v1/provisioning/bypass-pin {
            proxy_pass         http://takmdm_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # Agent APK download during provisioning. Unauthenticated by necessity:
        # the setup wizard fetches it before the device has any identity, and
        # Android verifies it against the signature checksum.
        location = /api/v1/provisioning/agent.apk {
            proxy_pass         http://takmdm_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location = /healthz {
            proxy_pass         http://takmdm_api;
            proxy_set_header   Host $host;
        }

        # The long-poll doorbell (F3) deliberately holds a request open for up to
        # 300 seconds. nginx's default proxy_read_timeout is 60, which kills it
        # with a 504 first — the agent then falls back to polling and immediate
        # propagation silently stops working. Must exceed the endpoint's own cap.
        location = /api/v1/device/wait {
            if ($ssl_client_verify != SUCCESS) {
                return 403 '{"detail":"client certificate required"}';
            }
            default_type application/json;

            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
            # Nothing to buffer on a request that produces one small response at an
            # unpredictable moment.
            proxy_buffering off;

            proxy_pass         http://takmdm_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-SSL-Client-Cert $client_cert;
        }

        # Device endpoints demand a verified certificate. The app enforces this too;
        # rejecting at the edge means an unauthenticated request never reaches it.
        location /api/v1/device/ {
            if ($ssl_client_verify != SUCCESS) {
                return 403 '{"detail":"client certificate required"}';
            }
            default_type application/json;

            # Tightened from the 512m set at the http level for APK uploads. That
            # limit exists for the admin surface; inheriting it here lets anything
            # holding a device certificate post half a gigabyte at the LAN-facing
            # port, which no device endpoint has any reason to accept.
            #
            # 4m is comfortably above the largest legitimate body — a diagnostic log
            # bundle, capped at 1m of content in the application and inflated some by
            # JSON escaping — and deliberately above the application's own limit, so
            # the app stays the binding constraint. Its refusal names the size and
            # the ceiling; an edge rejection is a bare 413 that explains neither.
            client_max_body_size 4m;

            proxy_pass         http://takmdm_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-SSL-Client-Cert $client_cert;
        }

        # NOTE for production: the admin API (/api/v1/policies, /devices,
        # /enrollment-tokens, ...) has no authentication of its own yet. Restrict it
        # to an operator network or put SSO in front before this leaves a lab.
    }

    # --------------------------------------------------------------------- #
    # Admin console — 9443, operators only (W36)
    #
    # Separate from the device port on purpose. 8443 verifies *device*
    # certificates and must stay reachable by every enrolled tablet; this port
    # authenticates *people* and should be reachable by as few as possible.
    #
    # ⚠️ SECURITY-CRITICAL. The app runs `admin_auth_mode=forward_auth`: it fails
    # closed when X-Authentik-Username is absent, and trusts it completely when
    # present. So the entire guard is "only this proxy can set that header".
    #
    # Two things enforce it, and both matter:
    #   1. The app listens on 127.0.0.1:8000 and is published on no external
    #      interface, so nothing can reach it except nginx.
    #   2. `proxy_set_header` REPLACES the client's value rather than appending.
    #      A request arriving here with its own X-Authentik-Username has that
    #      value overwritten with the Basic-auth user before it is forwarded.
    #
    # The empty-string assignments below are belt and braces for the headers we
    # do not otherwise set: an unset header we forget about is the whole attack.
    # --------------------------------------------------------------------- #
    server {
        listen 9443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /pki/server.crt;
        ssl_certificate_key /pki/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # No client certificates here. Devices authenticate with certificates on
        # 8443; operators authenticate as people, and issuing every admin a device
        # certificate would conflate two very different things.

        # An APK is 24 MB and policies can carry archives.
        client_max_body_size 2048m;

        location / {
            auth_basic           "ATLAS console";
            auth_basic_user_file /pki/console.htpasswd;

            # The proxy_pass and the header injection that is the auth boundary.
            # Shared with the 443 listener so the two cannot drift apart (W100).
            include /etc/nginx/console-proxy.inc;
        }
    }

    # --------------------------------------------------------------------- #
    # The console on 443, under its own name (W100).
    #
    # `mdm.tak-solutions.com` resolves here, and 9443 already answered to it
    # because that block matches any name. This adds only the bare URL, so an
    # operator types a hostname rather than an address and a port.
    #
    # ⚠️ **The same auth boundary, on a far more visible port.** Nothing about
    # who may enter changes — HTTP Basic, the same htpasswd — but 443 is scanned
    # constantly and 9443 is not. The console is now findable, so the strength of
    # that one password matters more than it did yesterday.
    #
    # ⚠️ **The landing page mints credentials.** `/enrollment` is an operator
    # page: its "Generate QR" issues a 15-minute token that lets a device join
    # the fleet. Convenient to reach is exactly what was asked for, and it is
    # worth being clear that convenience is what was added, not a public page.
    # --------------------------------------------------------------------- #
    server {
        listen 443 ssl;
        http2 on;
        server_name mdm.tak-solutions.com;

        # Let's Encrypt, renewed by the timer in docs/REMOTE_SERVER.md. The
        # self-signed certificate the other listeners use is fine for a device
        # that pins a CA, and useless for a browser typing a real hostname.
        ssl_certificate     /etc/letsencrypt/live/mdm.tak-solutions.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mdm.tak-solutions.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 2048m;

        # The whole point of the name: land on enrollment rather than the
        # dashboard. Only the bare path — every other URL is left alone so a
        # bookmark or a redirect from inside the console still works.
        location = / {
            return 302 /enrollment;
        }

        location / {
            auth_basic           "ATLAS console";
            auth_basic_user_file /pki/console.htpasswd;

            include /etc/nginx/console-proxy.inc;
        }
    }
}
