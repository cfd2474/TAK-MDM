name: takmdm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: takmdm
      POSTGRES_PASSWORD: takmdm
      POSTGRES_DB: takmdm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takmdm -d takmdm"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot. nginx must be able to read the device CA at startup to verify client
  # certificates, so the PKI cannot be created lazily on first request.
  init:
    build: .
    command: ["python", "-m", "app.cli", "init-pki", "--dev-server-cert", "--hostname", "localhost"]
    environment:
      TAKMDM_PKI_DIR: /pki
      TAKMDM_SKIP_DB_WAIT: "1"
    volumes:
      - ./pki:/pki
    restart: "no"

  api:
    build: .
    environment:
      TAKMDM_DATABASE_URL: postgresql+psycopg://takmdm:takmdm@db:5432/takmdm
      TAKMDM_PKI_DIR: /pki
      TAKMDM_SERVER_URL: https://localhost:8443
    volumes:
      - ./pki:/pki
    ports:
      # Bound to loopback only. This port bypasses the proxy and therefore bypasses
      # mTLS — convenient for admin curl during development, and exactly the
      # exposure that must never exist in production (R7).
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    volumes:
      # ./pki is a bind mount rather than a named volume so the host can read the
      # CA and the dev TLS certificate directly — scripts/dev_enroll.py needs both.
      # On a Linux host you may need `sudo chown -R 1000:1000 ./pki` once.
      - ./pki:/pki:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
